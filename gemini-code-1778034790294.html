<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CycTrack Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <style>
        body {
            background-color: #000; color: #fff; font-family: sans-serif;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 100vh; margin: 0;
        }
        .label { font-size: 1rem; color: #888; text-transform: uppercase; }
        .value { font-size: 5.5rem; font-weight: bold; color: #00ff00; line-height: 1; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; width: 90%; gap: 20px; text-align: center; margin-top: 20px; }
        .small-value { font-size: 2.2rem; font-weight: bold; }
        #startBtn {
            margin-top: 30px; padding: 18px 50px; font-size: 1.2rem; font-weight: bold;
            border-radius: 40px; border: none; background-color: #222; color: white;
            box-shadow: 0 4px 15px rgba(0,255,0,0.1); transition: 0.3s;
        }
        #startBtn.active { background-color: #ff3b30; box-shadow: 0 4px 15px rgba(255,0,0,0.3); }
        #historyList { width: 90%; margin-top: 20px; max-height: 150px; overflow-y: auto; border-top: 1px solid #222; }
        .history-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #111; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="label">Vận tốc (km/h)</div>
    <div id="speed" class="value">0.0</div>

    <div class="grid">
        <div>
            <div class="label">Quãng đường</div>
            <div id="distance" class="small-value">0.00</div>
            <div class="label">km</div>
        </div>
        <div>
            <div class="label">Thời gian</div>
            <div id="timer" class="small-value">00:00</div>
            <div class="label">phút:giây</div>
        </div>
    </div>

    <button id="startBtn">BẮT ĐẦU</button>
    <div id="historyList"></div>

    <script>
        // Đăng ký Service Worker để chạy Offline
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        let watchID = null, totalDistance = 0, lastCoords = null, elapsedSeconds = 0, timerInterval = null;

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const dLat = (lat2-lat1) * Math.PI/180;
            const dLon = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function saveAndReset() {
            if (totalDistance > 5) { // Chỉ lưu nếu đi trên 5 mét
                const history = JSON.parse(localStorage.getItem('rides') || '[]');
                history.unshift({ date: new Date().toLocaleDateString('vi-VN'), dist: (totalDistance/1000).toFixed(2), time: document.getElementById('timer').innerText });
                localStorage.setItem('rides', JSON.stringify(history.slice(0, 10)));
                renderHistory();
            }
            totalDistance = 0; elapsedSeconds = 0; lastCoords = null;
            document.getElementById('distance').innerText = "0.00";
            document.getElementById('timer').innerText = "00:00";
            document.getElementById('speed').innerText = "0.0";
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('rides') || '[]');
            document.getElementById('historyList').innerHTML = history.map(i => `<div class="history-item"><span>${i.date}</span><span style="color:#0f0">${i.dist} km</span><span>${i.time}</span></div>`).join('');
        }

        document.getElementById('startBtn').onclick = function() {
            if (watchID) {
                navigator.geolocation.clearWatch(watchID);
                clearInterval(timerInterval);
                saveAndReset();
                watchID = null; this.innerText = "BẮT ĐẦU"; this.classList.remove('active');
            } else {
                timerInterval = setInterval(() => { elapsedSeconds++; let m = Math.floor(elapsedSeconds/60).toString().padStart(2,'0'), s = (elapsedSeconds%60).toString().padStart(2,'0'); document.getElementById('timer').innerText = m+":"+s; }, 1000);
                watchID = navigator.geolocation.watchPosition(pos => {
                    let s = pos.coords.speed || 0; document.getElementById('speed').innerText = (s > 0.5 ? s*3.6 : 0).toFixed(1);
                    if (lastCoords) {
                        let d = calculateDistance(lastCoords.latitude, lastCoords.longitude, pos.coords.latitude, pos.coords.longitude);
                        if (d > 2) { totalDistance += d; document.getElementById('distance').innerText = (totalDistance/1000).toFixed(2); }
                    }
                    lastCoords = pos.coords;
                }, null, { enableHighAccuracy: true });
                this.innerText = "KẾT THÚC"; this.classList.add('active');
            }
        };
        renderHistory();
    </script>
</body>
</html>
